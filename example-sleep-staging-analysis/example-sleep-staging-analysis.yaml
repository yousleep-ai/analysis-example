# The analysis configuration: what the portal needs to know to offer, run and
# present an analysis. This one describes the staging example beside it.
#
# Only the fields an author can know are here. Everything the platform decides
# — scheduling priority, pricing, the image digest pinned at registration, GPU
# placement, the memory terms that scale with recording length — is filled in
# at registration and does not belong in this file.

identification:
  name: "Example Sleep Staging Analysis v1"   # unique, human-readable

purpose:
  description: "A minimal example that scores every epoch 'Sleep stage ?'. It performs no analysis; it demonstrates the interface."
  analysis_types: ["staging"]
  tags: ["example"]

# Who wrote the software, and under what terms it is published. Shown in the
# catalogue and on the attribution page, so it has to be true. This example is
# youSleep's own; an analysis packaged from software published elsewhere says
#   origin: "third-party", developer: "<its authors>",
#   source_url: "<where it is published>", source_licence: "<SPDX id, e.g. BSD-3-Clause>"
provenance:
  origin: "yousleep"
  developer: "youSleep"

# What the analysis cites. `by` is authorship, not quality: "developer" for the
# authors' own publications, "independent" for anyone else's. Leave the list
# empty if there is nothing to cite yet.
evidence:
  publications:
    - title: "Example full paper title"
      url: https://www.example.com/
      name: "Authors et al., 2024"
      by: "developer"

# The image the portal runs. A digest is pinned at registration; the tag alone
# identifies the build you mean.
docker:
  image: "ghcr.io/yousleep-ai/yousleep/example-sleep-staging-analysis"
  tag: "1.2.0"

# What one run needs. Cores and a base memory figure are what an author knows;
# the terms that scale with recording length are set at registration, from
# measurements the platform team makes on long recordings.
resources:
  cpu_cores: 1
  base_system_memory_mib: 500

# The licence class the analysis is offered under. Set at registration.
licence:
  type: "non-commercial"
  version: "latest"

inputs:
  recording:
    format: "edf"
    # Either name exact channels (`channels`) or ask for types (`channel_types`).
    # This example takes one to eight EEG channels, whatever they are called.
    channel_types:
      - type: "EEG"
        number:
          range: [1, 8]
        requirements:
          sampling_rate:
            range: [100, "+inf"]     # at least 100 Hz
          quality: []

outputs:
  events:
    - label: "Sleep stage ?"

# Parameters the user can set. Each reaches the container in the manifest,
# keyed by `key` and typed as declared. Omit the block if there are none.
parameters:
  custom:
    - name: "Staging window length"
      key: "staging-window-length-ms"
      type: "int"
      default: 30000
      description: "The length of each staging window."
      choices:
        - value: 15000
          description: "15 seconds"
        - value: 30000
          description: "30 seconds"
        - value: 60000
          description: "60 seconds"
      # An analysis characterised at some values declares them, and every other
      # value is then presented as a research setting:
      #   validated_regime: [30000]
      # This example was never characterised at any, so it makes no claim.
