# The configuration for the downstream example: an analysis that takes another
# analysis's events as its input. See the staging example's configuration for
# the field-by-field notes; only what differs is commented here.

identification:
  name: "Example Downstream Analysis v1"

purpose:
  description: "A minimal example of one analysis consuming another's output. It returns an 'EEG arousal' wherever the input events say 'Sleep stage ?'. It performs no analysis; it demonstrates chaining."
  analysis_types: ["arousals"]
  tags: ["example"]

provenance:
  origin: "yousleep"
  developer: "youSleep"

evidence:
  publications:
    - title: "Example full paper title"
      url: https://www.example.com/
      name: "Authors et al., 2024"
      by: "developer"

docker:
  image: "ghcr.io/yousleep-ai/yousleep/example-downstream-analysis"
  tag: "1.2.0"

resources:
  cpu_cores: 1
  base_system_memory_mib: 500

licence:
  type: "non-commercial"
  version: "latest"

inputs:
  recording:
    format: "edf"
    channel_types:
      - type: "EEG"
        number:
          range: [1, 8]
        requirements:
          sampling_rate:
            range: [100, "+inf"]
          quality: []
  # This is what makes it downstream: it asks for events another analysis
  # produced. The portal resolves which upstream run supplies them and names
  # the document in the manifest.
  events:
    - label: "Sleep stage ?"

outputs:
  events:
    - label: "EEG arousal"
