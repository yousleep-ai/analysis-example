# An example analysis config for an analysis which does roughly the following:
# - Recieves a single EDF file that has at least 1 EEG channel (any)
# - Has a small set of resource requirements (1-2 CPU cores, 1-2 GB of system memory, no GPU)
# - Has arbitrary costs (none) and limits (low)
# - Requires the 'Sleep stage ?' event file to be passed as input
# - Outputs the 'EEG arousal' event whereever the input events are 'Sleep stage ?'

# All other fields are examples/placeholders to be filled in by the analysis developer
# The fields are described in the documentation at https://docs.yousleep.ai/analysis-config

# General ID and version information
identification:
  # The human readable, unique name of the analysis
  name: "Example Downstream Analysis v1"

purpose:
  description: "This is a minimal downstream analysis example for the youSleep portal, showing how one analysis (e.g., Example Sleep Staging v1) passes its output to another. This analysis returns the 'EEG arousal' field where the input events are 'Sleep stage ?'."
  analysis_types:
    - "arousals"
  tags:
    - "example"

evidence:
  publications:
    - title: "Example full paper title"
      url: https://www.example.com/
      name: "Authors et al., 2024"

# Docker image settings used to build the analysis image
docker:
  image: "ghcr.io/yousleep-ai/yousleep/example-downstream-analysis"
  tag: "latest"
  # No digest pin (#515): this example deliberately tracks a mutable tag;
  # production configs pin a digest alongside their version tag.
  remote_https_url: "https://github.com/yousleep-ai/analysis-example"
  # relative_ssh_key_path: './id_rsa' # Path from root repo to a private SSH key for accessing the remote repository
  relative_build_path: "./example-downstream-analysis" # Path from root repo to a folder storing the Dockerfile

# Toy/example resource profile — small constants, no per-hour scaling.
resources:
  cpu_cores: 1
  base_system_memory_mib: 500
  per_hour_per_channel_system_memory_mib: 0
  base_gpu_memory_mib: 0
  per_hour_per_channel_gpu_memory_mib: 0
  artifacts_memory_mib: 50
  per_hour_artifacts_memory_mib: 0
  gpus: 0
  gpu_required: false

# Costs for the analysis

# Priority of the analysis
priority:
  base: 0  # Base priority of the analysis (applies to every submission). Higher value means higher priority.

# Licence information
licence:
  type: "non-commercial"
  version: "latest"

# Input data requirements for the analysis
# A list of input files of possible types:
#   - 'recording' for signal data / sleep recording, e.g. EEG/EOG. Usually an EDF file.
#   - 'metadata' for metadata files, e.g. study information.
#   - 'events' for event files, e.g. sleep stage annotations.
inputs:
  # The 'recording' input type represents one or more signal data / sleep recording file(s). Usually a single EDF file.
  # Analyses that support recieving signals over multiple files should have 'allow_multiple' set to true and support
  # recieving multiple paths as input to the recording argument.
  metadata: null  # No metadata file is required for this analysis
  recording:
    allow_multiple: false    # Only one recording file is allowed. Value will be a single path string.
    format: "edf" # Only allow EDF file formats to be passed to the analysis
    description: "The input recordings data to be scored."
    minimum_duration_seconds: 1  # Example value
    channels: []
      # (optionally empty) a list of specific channel names and types that are required. Empty list means any channel as per channel_types is accepted.
      # Cannot be used if 'channel_types' is set.
      # Example:
      # - name: "EEG Fp1-A2"
      #   type: "EEG"
      #   requirements:
      #    ...
    channel_types:
      # (optionally empty) or a list of channel types that are required. Empty list means only specific channels in 'channels' are accepted.
      # Cannot be used if 'channels' is set.
      - type: "EEG"
        number:
          range: [1, 8] # 1-8 EEG channels
        requirements:
          sampling_rate:
            range: [100, "+inf"] # Sampling rate must be at least 100 Hz, no upper limit
          quality:
            # A list of quality constraints that the channel must satisfy
            - score:
                range: [0.0, "+inf"] # Quality must be at least 0.0, no upper limit
              # 'signal_quality_score' is a method that the platform uses to calculate the quality of the signal
              # The method is defined by the platform and the analysis does not need to implement it
              method: "signal_quality_score"
              # modes can be 'global' or 'per_epoch'. If global, the channel cannot be passed to the
              # analysis if the whole-recording quality is below the min_quality. If per_epoch, the channel
              # can be passed to the analysis. If 'per_epoch', the analysis will receive the channel
              # but the platform will indicate that any events within epochs with quality below
              # min_quality should be considered uncertain.
              mode: "global"
  events:
    - label: "Sleep stage ?"
      instant: false
      probabilistic: false
      valued: false

outputs:
  # 'fields' is a list of output data that the analysis produces in the JSON output file
  # The file may contain other fields, but they are not processed by the YouSleep platform
  events:
    - label: "EEG arousal"
      instant: false
      probabilistic: false
      valued: false

# Analysis parameters (global as well as analysis-specific listed)
parameters:
  # Every parameter reaches the container through the analysis manifest,
  # keyed by `key` and typed as declared here (ADR-062). The platform passes
  # nothing else: paths, channels and resources are in the manifest too.
  custom: []
